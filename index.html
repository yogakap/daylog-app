<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>活動ログ</title>
<style>
:root{--bg:#f3f5f8;--fg:#1c2430;--mut:#667085;--card:#fff;--line:#dde2ea;--acc:#1f5f8b;--accfg:#fff;--bar:#1f5f8b;--err:#b42318;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--fg:#e6eaf0;--mut:#93a0b3;--card:#181f29;--line:#2a3441;--acc:#6fb0e0;--accfg:#0b1118;--bar:#6fb0e0;--err:#f97066}}
:root[data-theme="dark"]{--bg:#10151c;--fg:#e6eaf0;--mut:#93a0b3;--card:#181f29;--line:#2a3441;--acc:#6fb0e0;--accfg:#0b1118;--bar:#6fb0e0;--err:#f97066}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:700px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:68px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:inherit;background:var(--acc);color:var(--accfg);border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
button.sub{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.5}
#st{margin-left:10px;font-size:13px;color:var(--mut)}
#msg{color:var(--err);font-size:14px;white-space:pre-wrap}
#prev{font-size:13px;color:var(--mut);border-left:3px solid var(--acc);padding:2px 10px;margin-top:10px;white-space:pre-wrap}
.item{padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item span{color:var(--mut);font-size:13px;margin-left:8px}
.item p{margin:0;font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{overflow-x:auto}
.hint{font-size:13px;color:var(--mut);margin:0 0 6px}
</style></head><body><main>
<header><h1>活動ログ</h1><div><button class="sub" id="reload">再読み込み</button> <button class="sub" id="gear">接続設定</button></div></header>
<div id="msg" class="card" hidden></div>

<div class="card" id="cfgbox" hidden>
  <h2>GitHubとの接続設定</h2>
  <p class="hint">この端末のブラウザにだけ保存されます。PCとスマホで、それぞれ入力してください。</p>
  <label for="owner">GitHubのユーザー名</label><input id="owner" autocomplete="off" autocapitalize="none">
  <label for="repo">日記用リポジトリ名(非公開)</label><input id="repo" autocomplete="off" autocapitalize="none" placeholder="my-log-data">
  <label for="branch">ブランチ</label><input id="branch" value="main" autocapitalize="none">
  <label for="token">アクセストークン</label><input id="token" type="password" autocomplete="off">
  <button id="cfgsave">保存して接続</button>
</div>

<div class="card" id="form">
  <div class="row">
    <div><label for="date">日付</label><input type="date" id="date"></div>
    <div><label for="mins">作業時間(分)</label><input type="number" id="mins" min="0" step="5" inputmode="numeric"></div>
  </div>
  <label for="tag">タグ(例:Unity、動画編集)</label><input id="tag">
  <div id="prev" hidden></div>
  <label for="did">今日やったこと</label><textarea id="did"></textarea>
  <label for="progress">進捗</label><textarea id="progress"></textarea>
  <label for="reflect">反省</label><textarea id="reflect"></textarea>
  <label for="next">次回の目標</label><textarea id="next"></textarea>
  <label for="learned">学んだこと</label><textarea id="learned"></textarea>
  <button id="save">保存</button><span id="st"></span>
</div>

<div class="card"><h2>作業時間(直近14日)</h2><div class="scroll"><svg id="chart" width="100%" viewBox="0 0 560 160" role="img" aria-label="作業時間の棒グラフ"></svg></div></div>
<div class="card"><h2>これまでの記録</h2><div id="list"></div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const F=[['did','今日やったこと'],['progress','進捗'],['reflect','反省'],['next','次回の目標'],['learned','学んだこと']];
const H=Object.fromEntries(F.map(([k,h])=>[h,k]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cfg=null,cache={},entries={};
try{cfg=JSON.parse(store.get('log-cfg')||'null')}catch(e){}
try{cache=JSON.parse(store.get('log-cache')||'{}')}catch(e){}

const b64enc=t=>{const u=new TextEncoder().encode(t);let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const b64dec=b=>{const s=atob(b.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0)))};
function msg(t){const m=$('#msg');m.textContent=t||'';m.hidden=!t}

async function gh(path,opt={}){
  const r=await fetch('https://api.github.com/repos/'+cfg.owner+'/'+cfg.repo+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+cfg.token,'Content-Type':'application/json'}});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('GitHubからエラーが返りました('+r.status+')。トークンの権限と有効期限を確認してください。');
  return r.json();
}
const ref=()=>'?ref='+encodeURIComponent(cfg.branch||'main');

function parse(t){
  const e={};let body=t;
  const m=t.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(m){m[1].split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)e[l.slice(0,i).trim()]=l.slice(i+1).trim()});body=m[2]}
  e.mins=Number(e.mins)||0;
  body.split(/^## /m).slice(1).forEach(s=>{const i=s.indexOf('\n');const h=(i<0?s:s.slice(0,i)).trim();if(H[h])e[H[h]]=i<0?'':s.slice(i+1).trim()});
  return e;
}
const ser=e=>'---\ndate: '+e.date+'\nmins: '+e.mins+'\ntag: '+e.tag+'\n---\n\n'+F.map(([k,h])=>'## '+h+'\n'+(e[k]||'').replace(/^## /gm,'### ')+'\n').join('\n');

function prevGoal(d){const k=Object.keys(entries).filter(x=>x<d&&entries[x].next).sort().pop(),p=$('#prev');
  if(k){p.hidden=false;p.textContent='前回('+k+')の目標\n'+entries[k].next}else p.hidden=true}
function fill(){
  const d=$('#date').value,e=entries[d]||{};
  F.forEach(([k])=>$('#'+k).value=e[k]||'');
  $('#mins').value=e.mins||'';$('#tag').value=e.tag||'';prevGoal(d);
}
function chart(){
  const days=[],now=new Date();
  for(let i=13;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push(ymd(d))}
  const v=days.map(d=>(entries[d]||{}).mins||0),max=Math.max(60,...v);let s='';
  days.forEach((d,i)=>{const h=v[i]/max*108,x=10+i*39;
    s+='<rect x="'+x+'" y="'+(120-h)+'" width="28" height="'+h+'" rx="3" fill="var(--bar)"/>';
    if(v[i])s+='<text x="'+(x+14)+'" y="'+(114-h)+'" font-size="10" text-anchor="middle" fill="var(--mut)">'+v[i]+'</text>';
    s+='<text x="'+(x+14)+'" y="140" font-size="10" text-anchor="middle" fill="var(--mut)">'+d.slice(8)+'</text>'});
  $('#chart').innerHTML=s+'<line x1="0" x2="560" y1="120" y2="120" stroke="var(--line)"/>';
}
function list(){
  const box=$('#list'),keys=Object.keys(entries).sort().reverse();box.innerHTML='';
  if(!keys.length){const p=document.createElement('p');p.className='hint';p.textContent='まだ記録がありません。今日の分を書いて保存してみましょう。';box.append(p);return}
  keys.forEach(k=>{const e=entries[k],div=document.createElement('div');div.className='item';
    const b=document.createElement('b');b.textContent=k;
    const s=document.createElement('span');s.textContent=[e.mins?e.mins+'分':'',e.tag||''].filter(Boolean).join(' / ');
    const p=document.createElement('p');p.textContent=e.did||'';
    div.append(b,s,p);div.onclick=()=>{$('#date').value=k;fill();scrollTo({top:0,behavior:'smooth'})};box.append(div)});
}
async function load(){
  if(!cfg||!cfg.token){$('#cfgbox').hidden=false;return}
  msg('');$('#st').textContent='読み込み中…';
  try{
    if(!(await gh('')))throw new Error('リポジトリが見つかりません。ユーザー名とリポジトリ名、トークンの対象リポジトリを確認してください。');
    const l=(await gh('/contents/entries'+ref()))||[];
    const files=l.filter(x=>/^\d{4}-\d\d-\d\d\.md$/.test(x.name)).sort((a,b)=>b.name.localeCompare(a.name)).slice(0,60);
    const next={};entries={};
    await Promise.all(files.map(async f=>{
      const d=f.name.slice(0,10);let e=cache[f.sha];
      if(!e){const j=await gh('/contents/entries/'+f.name+ref());e=parse(b64dec(j.content));e.date=d}
      next[f.sha]=e;entries[d]=e}));
    cache=next;store.set('log-cache',JSON.stringify(cache));
    $('#st').textContent='';fill();chart();list();
  }catch(e){$('#st').textContent='';msg(String(e.message||e)+'\nネットワークにつながっているかも確認してください。')}
}
async function save(){
  const d=$('#date').value;if(!d||!cfg)return;
  const e={date:d,mins:Number($('#mins').value)||0,tag:$('#tag').value.trim()};
  F.forEach(([k])=>e[k]=$('#'+k).value);
  $('#save').disabled=true;$('#st').textContent='保存中…';msg('');
  try{
    const p='/contents/entries/'+d+'.md',cur=await gh(p+ref());
    await gh(p,{method:'PUT',body:JSON.stringify({message:'log: '+d,content:b64enc(ser(e)),branch:cfg.branch||'main',...(cur?{sha:cur.sha}:{})})});
    await load();$('#st').textContent='保存しました';
  }catch(err){$('#st').textContent='';msg('保存できませんでした。\n'+err.message)}
  $('#save').disabled=false;
}
$('#date').value=ymd(new Date());
$('#date').addEventListener('change',fill);
$('#save').addEventListener('click',save);
$('#reload').addEventListener('click',load);
$('#gear').addEventListener('click',()=>{const b=$('#cfgbox');b.hidden=!b.hidden;
  if(cfg){$('#owner').value=cfg.owner||'';$('#repo').value=cfg.repo||'';$('#branch').value=cfg.branch||'main'}});
$('#cfgsave').addEventListener('click',()=>{
  const c={owner:$('#owner').value.trim(),repo:$('#repo').value.trim(),branch:$('#branch').value.trim()||'main',token:$('#token').value.trim()||(cfg&&cfg.token)||''};
  if(!c.owner||!c.repo||!c.token){msg('ユーザー名、リポジトリ名、トークンをすべて入力してください。');return}
  cfg=c;store.set('log-cfg',JSON.stringify(cfg));$('#token').value='';$('#cfgbox').hidden=true;load();
});
chart();list();load();
</script></body></html>
